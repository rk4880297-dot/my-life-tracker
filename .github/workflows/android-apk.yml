
name: Build My Life Tracker APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'my-life-tracker-source.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          mkdir app-src
          unzip -q my-life-tracker-source.zip -d app-src

          PROJECT_DIR=$(find app-src -name package.json -not -path '*/node_modules/*' -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Error: package.json not found in ZIP"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Node.js Version
        run: |
          node --version
          npm --version
          node -e "if (Number(process.versions.node.split('.')[0]) < 22) process.exit(1)"

      - name: Install Dependencies and Build
        run: |
          cd "$PROJECT_DIR"
          npm install

          REACT_MAJOR=$(node -p "require('./node_modules/react/package.json').version.split('.')[0]")
          npm install "react-is@$REACT_MAJOR"

          npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK Packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "Using Android SDK: $SDK_ROOT"

          sdkmanager --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Sync Capacitor Android
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Life-Tracker-Debug-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
